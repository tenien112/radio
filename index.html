<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADIO-LORENZITO</title>
<meta name="author" content="Lorenzo Moreno">
<meta name="copyright" content="© Lorenzo Moreno">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B0F2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radio">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2B0F2E; --surface:#3D1A42; --line:#5A2E60;
  --text:#F7EAF3; --muted:#B89AB5; --accent:#FF4FA3; --warm:#FFC857;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(1.9rem,8.5vw,3.4rem);font-weight:800;letter-spacing:-.04em;line-height:.9;margin:0 0 22px}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}

/* Dial */
.dial{position:relative;height:88px;background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:18px}
.ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 14px);opacity:.7;mask:linear-gradient(transparent 55%,#000 55%)}
.needle{position:absolute;top:8px;bottom:8px;width:4px;background:var(--accent);border-radius:2px;left:6%;transition:left .6s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 18px var(--accent)}
.now{position:absolute;left:16px;top:12px;right:16px;display:flex;align-items:center;gap:10px}
.now img{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--line)}
.now .n{font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .s{font-size:.8rem;color:var(--muted)}

/* Controls */
.controls{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:#2B0F2E;font-size:1.6rem;cursor:pointer;flex:none}
.play:disabled{opacity:.4;cursor:default}
input[type=range]{flex:1;accent-color:var(--accent)}

/* Presets */
h2{font-size:1.1rem;font-weight:600;margin:0 0 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:26px}
.st{display:flex;align-items:center;gap:8px;text-align:left;padding:12px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;cursor:pointer;font-size:.95rem}
.st:hover{border-color:var(--muted)}
.st.on{border-color:var(--accent);background:var(--surface)}
.st img{width:24px;height:24px;border-radius:5px;object-fit:cover;flex:none}
.st .fav{margin-left:auto;color:var(--warm);background:none;border:0;cursor:pointer;font-size:1.1rem;padding:0 2px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-20px);max-width:92%;width:max-content;padding:14px 20px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.55);font-size:1rem;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.suave{background:var(--surface);color:var(--muted);font-weight:400;font-size:.85rem;padding:8px 14px;border:1px solid var(--line)}
.st{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet[hidden]{display:none}
.sheet-box{width:100%;max-width:480px;background:var(--surface);border-radius:16px 16px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet-title{font-weight:700;margin:2px 6px 14px;color:var(--text)}
.sheet button{display:block;width:100%;text-align:left;padding:14px;margin:0 0 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:1rem;cursor:pointer}
.sheet button.danger{color:var(--accent);border-color:var(--accent)}
.install{display:block;width:100%;margin:-6px 0 18px;padding:12px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.install[hidden]{display:none}
.st .del{color:var(--muted);cursor:pointer;font-size:1rem;padding:0 2px}

.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:1rem}
.search button{padding:0 18px;border-radius:10px;border:0;background:var(--text);color:var(--bg);font-weight:600;cursor:pointer}
.msg{color:var(--muted);font-size:.9rem;min-height:1.2em;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){.needle{transition:none}}
.copy{margin:32px 0 8px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>RADIO-LORENZITO</h1>
  <button type="button" class="install" id="install" hidden>📲 Instalar RADIO-LORENZITO en el móvil</button>

  <div class="dial" aria-hidden="true">
    <div class="ticks"></div>
    <div class="needle" id="needle"></div>
  </div>
  <div class="now" style="position:static;margin:-4px 0 16px">
    <img id="nowImg" alt="">
    <div style="min-width:0">
      <div class="n" id="nowName">Elige una emisora</div>
      <div class="s" id="nowInfo">Pulsa una de la lista o busca cualquier radio del mundo</div>
    </div>
  </div>

  <div class="controls">
    <button class="play" id="play" disabled aria-label="Reproducir">▶</button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
  </div>

  <h2>Emisoras</h2>
  <div class="grid" id="presets"></div>

  <h2 id="favTitle" hidden>Favoritas</h2>
  <div class="grid" id="favs"></div>

  <h2>Buscar emisora</h2>
  <form class="search" id="form">
    <input id="q" placeholder="Nombre, ciudad o estilo" autocomplete="off">
    <button>Buscar</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="grid" id="results"></div>

  <footer class="copy">© <span id="year">2026</span> Lorenzo Moreno. Todos los derechos reservados.</footer>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-box"><div class="sheet-title" id="sheetTitle"></div><div id="sheetBtns"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="none"></audio>

<script>
const PRESETS = ["Kiss FM","Cadena 100","Los 40","Europa FM","Cadena Dial","Rock FM","Cadena SER","COPE","Radio Nacional","Onda Cero","Hit FM","Loca FM"];
const SERVERS = ["https://de1.api.radio-browser.info","https://de2.api.radio-browser.info","https://fi1.api.radio-browser.info"];
const audio = document.getElementById("audio");
const $ = id => document.getElementById(id);
let current = null;

function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; }}
let favs = store("radio_favs") || [];
let extra = store("radio_extra") || [];
let hidden = store("radio_hidden") || [];  // emisoras fijas que has borrado  // emisoras añadidas al apartado Emisoras
audio.volume = store("radio_vol") ?? 0.8; $("vol").value = audio.volume;

async function api(path){
  for (const s of SERVERS){
    try{ const r = await fetch(s + path); if (r.ok) return await r.json(); }catch(e){}
  }
  throw new Error("sin conexión");
}
async function search(name, country){
  const p = new URLSearchParams({name, limit:"25", hidebroken:"true", order:"clickcount", reverse:"true"});
  if (country) p.set("countrycode", country);
  const list = await api("/json/stations/search?" + p);
  // Evita flujos HLS y, si la página va por https, las emisiones http (el navegador las bloquea)
  const secure = location.protocol === "https:";
  return list.filter(s => s.url_resolved && !s.hls && (!secure || s.url_resolved.startsWith("https:")));
}

function card(st, label){
  const b = document.createElement("button");
  b.className = "st"; b.type = "button";
  const img = document.createElement("img"); img.alt = ""; img.src = st?.favicon || "";
  img.onerror = () => img.style.visibility = "hidden";
  const t = document.createElement("span"); t.textContent = label || st.name;
  b.append(img, t);
  if (st){
    const f = document.createElement("span");
    f.className = "fav"; f.setAttribute("role","button");
    f.title = "Favorita"; f.textContent = isFav(st) ? "★" : "☆";
    f.onclick = e => { e.stopPropagation(); toggleFav(st); f.textContent = isFav(st) ? "★" : "☆"; };
    b.append(f);
  }
  return b;
}
// La estrella marca la emisora como favorita (bloque Favoritas) y además la deja en Emisoras
const isFav = st => favs.some(f => f.stationuuid === st.stationuuid);
function toggleFav(st){
  favs = isFav(st) ? favs.filter(f => f.stationuuid !== st.stationuuid) : [...favs, slim(st)];
  store("radio_favs", favs); renderFavs();
  if (isFav(st)) addExtra(st);
  renderPresets();  // refresca las estrellas del bloque Emisoras
}
const slim = st => ({stationuuid:st.stationuuid,name:st.name,url_resolved:st.url_resolved,favicon:st.favicon,country:st.country,codec:st.codec,bitrate:st.bitrate});
// Pasa una emisora (favorita o buscada) al apartado Emisoras, sin repetirla
function addExtra(st){
  if (extra.some(e => e.stationuuid === st.stationuuid)) return;
  extra = [...extra, slim(st)]; store("radio_extra", extra); renderPresets();
}
function delExtra(st){
  extra = extra.filter(e => e.stationuuid !== st.stationuuid); store("radio_extra", extra); renderPresets();
}
function renderFavs(){
  const g = $("favs"); g.innerHTML = "";
  $("favTitle").hidden = favs.length === 0;
  favs.forEach(st => { const b = card(st); b.onclick = () => play(st, b); onLongPress(b, () => stationMenu(st)); g.append(b); });
}

function renderPresets(){
  const g = $("presets"); g.innerHTML = "";
  PRESETS.forEach((name,i) => {
    if (hidden.includes(name)) return;
    const b = card(null, name);
    b.onclick = async () => {
      unlock();
      setMsg("Sintonizando " + name + "…");
      try{
        const r = await search(name, "ES");
        if (!r.length) return setMsg("No encuentro " + name + " ahora mismo. Prueba con el buscador.");
        play(r, b, i / (PRESETS.length - 1));
      }catch(e){ setMsg("No hay conexión con el directorio de emisoras. Revisa tu internet."); }
    };
    // Estrella de las emisoras fijas: busca la emisora y la guarda en Favoritas
    const f = document.createElement("span");
    f.className = "fav"; f.setAttribute("role","button"); f.title = "Favorita";
    const esFav = () => favs.some(x => x.presetName === name);
    f.textContent = esFav() ? "★" : "☆";
    f.onclick = e => { e.stopPropagation(); esFav() ? unfavPreset(name) : favPreset(name); };
    b.append(f);
    onLongPress(b, () => presetMenu(name));
    g.append(b);
  });
  extra.forEach(st => {
    const b = card(st); b.onclick = () => play(st, b);
    onLongPress(b, () => stationMenu(st));
    g.append(b);
  });
  if (hidden.length){
    const r = document.createElement("button");
    r.type = "button"; r.className = "st"; r.style.justifyContent = "center"; r.style.color = "var(--muted)";
    r.textContent = "Recuperar emisoras borradas";
    r.onclick = () => { hidden = []; store("radio_hidden", hidden); renderPresets(); };
    g.append(r);
  }
}

// ---- Menú al mantener pulsada una emisora ----
function onLongPress(el, fn){
  let t, fired = false, sx = 0, sy = 0;
  el.addEventListener("pointerdown", e => {
    fired = false; sx = e.clientX; sy = e.clientY;
    t = setTimeout(() => { fired = true; if (navigator.vibrate) navigator.vibrate(30); fn(); }, 550);
  });
  el.addEventListener("pointermove", e => { if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clearTimeout(t); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, () => clearTimeout(t)));
  el.addEventListener("click", e => { if (fired){ fired = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  el.addEventListener("contextmenu", e => e.preventDefault());
}
function openMenu(title, items){
  $("sheetTitle").textContent = title;
  const box = $("sheetBtns"); box.innerHTML = "";
  [...items, {label: "Cancelar"}].forEach(it => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = it.label;
    if (it.danger) b.className = "danger";
    b.onclick = () => { closeMenu(); if (it.action) it.action(); };
    box.append(b);
  });
  $("sheet").hidden = false;
}
function closeMenu(){ $("sheet").hidden = true; }
$("sheet").onclick = e => { if (e.target.id === "sheet") closeMenu(); };

async function favPreset(name){
  try{
    const r = await search(name, "ES");
    if (!r.length) return setMsg("No encuentro " + name + " ahora mismo.");
    favs = [...favs, {...slim(r[0]), presetName: name}]; store("radio_favs", favs); renderFavs(); renderPresets();
  }catch(err){ setMsg("No hay conexión con el directorio de emisoras. Revisa tu internet."); }
}
function unfavPreset(name){ favs = favs.filter(x => x.presetName !== name); store("radio_favs", favs); renderFavs(); renderPresets(); }
function hidePreset(name){ if (!hidden.includes(name)){ hidden = [...hidden, name]; store("radio_hidden", hidden); } renderPresets(); }
function showPreset(name){ hidden = hidden.filter(n => n !== name); store("radio_hidden", hidden); renderPresets(); }

function presetMenu(name){
  const fav = favs.some(x => x.presetName === name);
  openMenu(name, [
    fav ? {label: "Quitar de Favoritas", action: () => unfavPreset(name)} : {label: "Añadir a Favoritas", action: () => favPreset(name)},
    {label: "Borrar de Emisoras", danger: true, action: () => hidePreset(name)}
  ]);
}
function stationMenu(st){
  const items = [];
  items.push(isFav(st) ? {label: "Quitar de Favoritas", action: () => toggleFav(st)} : {label: "Añadir a Favoritas", action: () => toggleFav(st)});
  if (st.presetName){
    const enEmisoras = !hidden.includes(st.presetName);
    items.push(enEmisoras ? {label: "Borrar de Emisoras", danger: true, action: () => hidePreset(st.presetName)}
                          : {label: "Añadir a Emisoras", action: () => showPreset(st.presetName)});
  }else{
    const enEmisoras = extra.some(e => e.stationuuid === st.stationuuid);
    items.push(enEmisoras ? {label: "Borrar de Emisoras", danger: true, action: () => delExtra(st)}
                          : {label: "Añadir a Emisoras", action: () => addExtra(st)});
  }
  openMenu(st.name.trim(), items);
}

// Los móviles solo dejan sonar audio si play() se llama justo al tocar.
// Como la búsqueda tarda, "desbloqueamos" el reproductor con un silencio en el mismo toque.
const SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
function unlock(){ try{ markSelf(); audio.src = SILENCE; audio.play().catch(()=>{}); }catch(e){} }

let tuneId = 0, tuning = 0, wantPlay = false;
// interrupted = otra app (llamada, YouTube, vídeos…) ha pedido el audio. La radio se aparta y NO vuelve a sonar sola.
let interrupted = false, lastSelf = 0;
function markSelf(){ lastSelf = Date.now(); }  // marca que el cambio en el reproductor lo hace la propia app

async function play(...args){
  tuning++; wantPlay = true; interrupted = false;
  try{ return await tuneIn(...args); } finally { tuning--; }
}
async function tuneIn(list, btn, pos){
  unlock();
  if (!Array.isArray(list)) list = [list];
  const id = ++tuneId;
  document.querySelectorAll(".st.on").forEach(x => x.classList.remove("on"));
  btn?.classList.add("on");
  $("needle").style.left = (6 + (pos ?? Math.random()) * 86) + "%";
  // Prueba hasta 5 señales de la misma emisora hasta que una suene
  for (const st of list.slice(0, 5)){
    if (id !== tuneId) return;
    showStation(st);
    setMsg("Conectando con " + st.name.trim() + "…");
    markSelf(); audio.src = st.url_resolved;
    try{
      await Promise.race([audio.play(), new Promise((_, no) => setTimeout(() => no(new Error("timeout")), 10000))]);
      if (id === tuneId) setMsg("");
      return;
    }catch(e){
      if (e.name === "NotAllowedError"){ setMsg("Pulsa ▶ para empezar a escuchar."); return; }
    }
  }
  if (id === tuneId) setMsg("Esta emisora no emite ahora mismo. Prueba otra o búscala por nombre.");
}

function showStation(st){
  current = st;
  $("nowName").textContent = st.name.trim();
  $("nowInfo").textContent = [st.country, st.codec, st.bitrate ? st.bitrate + " kbps" : ""].filter(Boolean).join(", ");
  $("nowImg").src = st.favicon || "";
  $("play").disabled = false;
  if ("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title: st.name, artist: "Radio en directo", artwork: st.favicon ? [{src: st.favicon}] : []});
  }
}

$("play").onclick = () => {
  if (!current) return;
  if (audio.paused){ wantPlay = true; interrupted = false; markSelf(); audio.src = current.url_resolved; audio.play().then(()=>setMsg("")).catch(()=>setMsg("Esta emisora no responde. Prueba otra.")); }  // reconecta en directo
  else { wantPlay = false; interrupted = false; releaseBack(); markSelf(); audio.pause(); audio.removeAttribute("src"); audio.load(); }
};
audio.onplaying = () => { if (audio.src.startsWith("data:")) return; $("play").textContent = "❚❚"; $("play").ariaLabel = "Pausar"; };
audio.onpause = audio.onemptied = () => { if (audio.src.startsWith("data:")) return; $("play").textContent = "▶"; $("play").ariaLabel = "Reproducir"; };
$("vol").oninput = e => { audio.volume = e.target.value; store("radio_vol", audio.volume); };

$("form").onsubmit = async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  setMsg("Buscando…"); $("results").innerHTML = "";
  try{
    const r = await search(q);
    setMsg(r.length ? r.length + " emisoras encontradas" : "Ninguna emisora coincide. Prueba con otro nombre.");
    r.forEach(st => { const b = card(st); b.onclick = () => { play(st, b); addExtra(st); }; onLongPress(b, () => stationMenu(st)); $("results").append(b); });
  }catch(err){ setMsg("No hay conexión con el directorio de emisoras. Revisa tu internet."); }
};
// El mensaje sale también flotando abajo de la pantalla, para verlo estés donde estés
let toastTimer;
function setMsg(t){
  $("msg").textContent = t;
  const el = $("toast"); clearTimeout(toastTimer);
  if (!t){ el.classList.remove("show"); return; }
  el.textContent = t; el.classList.remove("suave"); el.classList.add("show");
  if (!t.endsWith("…")) toastTimer = setTimeout(() => el.classList.remove("show"), 7000);  // los "Conectando…" se quedan hasta el siguiente aviso
}

// Segundo plano: la radio sigue sonando al salir de la app y se reconecta sola si se corta la señal
let retryTimer, retries = 0;
function reconnect(){
  if (!wantPlay || interrupted || tuning || !current) return;
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => {
    if (!wantPlay || interrupted || tuning || !current || !audio.paused && !audio.error && !audio.ended) return;
    retries++;
    markSelf(); audio.src = current.url_resolved;
    audio.play().catch(() => {});
  }, Math.min(2000 * (retries + 1), 15000));
}
["error","stalled","ended"].forEach(ev => audio.addEventListener(ev, reconnect));
audio.addEventListener("playing", () => {
  retries = 0; if (!audio.src.startsWith("data:")) interrupted = false;
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
});
audio.addEventListener("pause", () => { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; });
// Si la pausa no la ha hecho la app (llamada de teléfono, YouTube, un vídeo…), la radio cede el sonido
// y se queda en pausa. Antes se volvía a poner sola y se peleaba con el móvil: cortaba los vídeos
// y seguía sonando durante las llamadas. Ahora se reanuda con ▶, con la notificación o sola al colgar si Android lo permite.
audio.addEventListener("pause", () => {
  if (audio.src.startsWith("data:") || tuning || !wantPlay || Date.now() - lastSelf < 1000) return;
  interrupted = true; clearTimeout(retryTimer);
  setMsg("Radio en pausa mientras la llamada o el vídeo usan el sonido. Al volver a la radio sigue sonando sola.");
});
// Al volver a la radio (tras colgar o dejar YouTube) sigue sonando sola, conectando otra vez en directo
function resumeAfterInterruption(){
  if (!document.hidden && wantPlay && audio.paused && current && !tuning){
    if (interrupted){
      interrupted = false; retries = 0; markSelf();
      audio.src = current.url_resolved;
      audio.play().then(() => setMsg("")).catch(e => {
        if (e.name === "NotAllowedError") setMsg("Pulsa ▶ para seguir escuchando.");
        else reconnect();
      });
    } else reconnect();
  }
}
document.addEventListener("visibilitychange", resumeAfterInterruption);
window.addEventListener("focus", resumeAfterInterruption);
window.addEventListener("pageshow", resumeAfterInterruption);
if ("mediaSession" in navigator){
  const resume = () => { if (!current) return; wantPlay = true; interrupted = false; markSelf(); audio.src = current.url_resolved; audio.play().catch(() => {}); };
  const stop = () => { wantPlay = false; interrupted = false; releaseBack(); markSelf(); audio.pause(); };
  for (const [a, f] of [["play", resume], ["pause", stop], ["stop", stop]]){
    try{ navigator.mediaSession.setActionHandler(a, f); }catch(e){}
  }
}

// Botón atrás de Android: cerraría la app y cortaría la radio.
// "Atrás" NUNCA cierra la app, ni sonando ni en pausa. Solo se cierra desde las apps recientes de Android.
let ignorePop = false, backTimer, backAviso = 0;
function guardBack(){ if (!(history.state && history.state.radio)) history.pushState({radio: 1}, ""); }
function releaseBack(){ clearTimeout(backTimer); }  // ya no suelta el freno al pausar
audio.addEventListener("playing", () => { if (!audio.src.startsWith("data:")) guardBack(); });
window.addEventListener("popstate", () => {
  if (ignorePop){ ignorePop = false; return; }
  guardBack();  // vuelve a poner el freno al momento: el siguiente "atrás" tampoco cierra
  if (Date.now() - backAviso > 8000){ backAviso = Date.now(); setMsg("Para salir usa el botón de inicio. Para cerrarla, ciérrala desde las apps recientes."); }
});
// Refuerzo: cada vez que tocas la app o vuelves a ella, se asegura el freno del botón atrás
document.addEventListener("pointerdown", guardBack, true);
document.addEventListener("visibilitychange", () => { if (!document.hidden) guardBack(); });

// Aviso discreto cuando la app se ha actualizado. Hay que cambiar APP_VERSION en cada actualización.
const APP_VERSION = "2026.09.19-4";
let justUpdated = false;
(() => {
  const prev = store("radio_version");
  store("radio_version", APP_VERSION);
  const yaUsada = prev !== null || store("radio_vol") !== null;  // no avisar la primera vez que se instala
  if (prev !== APP_VERSION && yaUsada){
    justUpdated = true;
    const el = $("toast");
    el.textContent = "RADIO-LORENZITO se ha actualizado";
    el.classList.add("suave", "show");
    toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
  }
})();

// Botón para instalar la app: Chrome no siempre lo ofrece solo en móviles nuevos
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("install").hidden = false; });
window.addEventListener("appinstalled", () => { $("install").hidden = true; installEvt = null; setMsg("RADIO-LORENZITO instalada"); });
$("install").onclick = async () => {
  if (installEvt){ installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt = null; $("install").hidden = true; return; }
  setMsg("En iPhone: pulsa Compartir y después «Añadir a pantalla de inicio».");
};
const enApp = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !enApp) $("install").hidden = false;  // iPhone no avisa solo

renderPresets(); renderFavs(); guardBack();
$("year").textContent = new Date().getFullYear();

// Al abrir, vuelve a sonar la última emisora que escuchaste
audio.addEventListener("playing", () => { if (current && !audio.src.startsWith("data:")) store("radio_last", slim(current)); });
const last = store("radio_last");
if (last && last.url_resolved){
  showStation(last);
  setTimeout(() => play(last), justUpdated ? 2500 : 0);  // si hay aviso de actualización, que se vea primero
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
